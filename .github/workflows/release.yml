name: release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: release ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: "pixy-linux-amd64"
            target: "x86_64-unknown-linux-musl"
          - os: ubuntu-24.04-arm
            artifact: "pixy-linux-arm64"
            target: "aarch64-unknown-linux-musl"
          - os: macos-15-intel
            artifact: "pixy-macos-amd64"
          - os: macos-14
            artifact: "pixy-macos-arm64"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build
        run: make release-build example-pack TARGET=${{ matrix.target }}
      - name: Check the artifact is complete
        run: make package-check TARGET=${{ matrix.target }}
      - name: Check the binary is static
        if: matrix.target
        run: |
          binary="target/${{ matrix.target }}/release/pixy"
          file "$binary"
          file "$binary" | grep -q 'static'
      - name: Package
        run: |
          release_dir="target/release"
          if [ -n "${{ matrix.target }}" ]; then
            release_dir="target/${{ matrix.target }}/release"
          fi
          mkdir -p dist
          cp "$release_dir/pixy" dist/pixy
          cp -R README.md LICENSE THIRD_PARTY.md LICENSES assets lua examples docs dist/
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist .
          tar -czf "${{ matrix.artifact }}-example-pack.tar.gz" \
            -C "$release_dir" pixy-example.pixypack
          shasum -a 256 \
            "${{ matrix.artifact }}.tar.gz" \
            "${{ matrix.artifact }}-example-pack.tar.gz" >"${{ matrix.artifact }}.sha256"
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}-example-pack.tar.gz
            ${{ matrix.artifact }}.sha256
      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}-example-pack.tar.gz
            ${{ matrix.artifact }}.sha256
