name: release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: release ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: "pixy-linux-amd64"
            cc: "musl-gcc"
          - os: ubuntu-24.04-arm
            artifact: "pixy-linux-arm64"
            cc: "musl-gcc"
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools clang
          curl -fsSL https://xmake.io/shget.text | bash
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      # release-musl refuses to finish if the result is not statically linked,
      # so the artifact cannot quietly come out needing a libc on the target.
      - name: Build
        env:
          PIXY_MUSL_CC: ${{ matrix.cc }}
        run: xmake release-musl
      - name: Check the artifact is complete
        env:
          PIXY_MUSL_CC: ${{ matrix.cc }}
        run: xmake package-check
      - name: Package
        run: |
          release_dir="build"
          mkdir -p dist
          cp build/pixy dist/pixy
          cp -R README.md LICENSE vendor/THIRD_PARTY.md lua examples docs dist/
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist .
          tar -czf "${{ matrix.artifact }}-example-pack.tar.gz" \
            -C "$release_dir" pixy-example.pixypack
          shasum -a 256 \
            "${{ matrix.artifact }}.tar.gz" \
            "${{ matrix.artifact }}-example-pack.tar.gz" >"${{ matrix.artifact }}.sha256"
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}-example-pack.tar.gz
            ${{ matrix.artifact }}.sha256
      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}-example-pack.tar.gz
            ${{ matrix.artifact }}.sha256
