name: release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    name: release ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: "pixy-linux-amd64"
          - os: ubuntu-24.04-arm
            artifact: "pixy-linux-arm64"
          - os: macos-15-intel
            artifact: "pixy-macos-amd64"
          - os: macos-14
            artifact: "pixy-macos-arm64"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: make release-build example-pack
      - name: Package
        run: |
          tar -czf "${{ matrix.artifact }}.tar.gz" "target/release/pixy" README.md LICENSE THIRD_PARTY.md LICENSES assets lua examples docs
          tar -czf "${{ matrix.artifact }}-example-pack.tar.gz" "target/release/pixy-example.pixypack"
      - name: Upload artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}-example-pack.tar.gz
