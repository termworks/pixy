name: tests

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install a musl-capable compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools clang
      - name: Build
        run: make release-build
      - name: Test
        run: make test
      - name: Pixy gates
        env:
          PIXY_BENCH_SCALE: "3"
        run: make smoke smoke-shell bench package-check
