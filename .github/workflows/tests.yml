name: tests

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools clang
          curl -fsSL https://xmake.io/shget.text | bash
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: Build
        run: xmake release-build
      - name: Test
        run: xmake pixy-test
      - name: Pixy gates
        env:
          PIXY_BENCH_SCALE: "3"
        run: xmake smoke && xmake smoke-shell && xmake bench && xmake package-check
      - name: Sanitizers and fuzz
        env:
          ROUNDS: "400"
        run: xmake sanitize && xmake fuzz
